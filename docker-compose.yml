name: smart-scheduler

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scheduler

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - scheduler

  backend:
    container_name: backend_scheduler
    image: smart-scheduler-backend
    build:
      context: src
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      DEFAULT_USERS_FILE: /run/secrets/default_users.json
      RUN_MIGRATIONS: "true"
      TZ: Europe/Moscow
    volumes:
      - uploads:/app/app/uploads
      - backend_logs:/app/logs
    secrets:
      - source: default_users
        target: default_users.json
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - scheduler

  worker:
    image: smart-scheduler-backend
    restart: unless-stopped
    command:
      [
        "celery",
        "--app=worker.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "false"
      TZ: Europe/Moscow
    volumes:
      - uploads:/app/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - scheduler

  frontend:
    build:
      context: spa
    volumes:
      - ./docker/config/nginx/${NGINX_FILE}:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    environment:
      NGINX_NAME: ${NGINX_FILE}
      RUN_MIGRATIONS: "false"
      TZ: Europe/Moscow
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - scheduler

volumes:
  postgres_data:
  redis_data:
  uploads:
  backend_logs:

networks:
  scheduler:
    driver: bridge

secrets:
  default_users:
    file: ${DEFAULT_USERS_FILE:-./secrets/default_users.json}
