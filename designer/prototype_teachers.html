<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ограничения Преподавателей MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        :root {
            --bg-body: #F4F5F8; --bg-card: #FFFFFF;
            --text-primary: #1A1F36; --text-secondary: #6B7280; --text-tertiary: #9CA3AF;
            --border-light: #E5E7EB; --accent-brand: #0f4c81;
            --blocked: #FEE2E2; --blocked-border: #FCA5A5; --blocked-text: #B91C1C;
            --radius-md: 12px; --radius-sm: 8px;
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --shadow-subtle: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-main); background: var(--bg-body); color: var(--text-primary); }
        .app-container { max-width: 1280px; margin: 0 auto; padding: 40px 24px; display: flex; gap: 24px; height: 100vh; }
        
        .card { background: var(--bg-card); border-radius: var(--radius-md); box-shadow: var(--shadow-subtle); border: 1px solid var(--border-light); display: flex; flex-direction: column; }
        
        /* Sidebar */
        .sidebar { width: 320px; flex-shrink: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-light); }
        .search-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); font-family: inherit; }
        .teacher-list { overflow-y: auto; flex: 1; }
        .teacher-item { padding: 16px 20px; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: background 0.2s; }
        .teacher-item:hover { background: #f9fafb; }
        .teacher-item.active { background: var(--accent-brand); color: white; }
        .teacher-item.active .t-dept { color: rgba(255,255,255,0.7); }
        .t-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .t-dept { font-size: 12px; color: var(--text-secondary); }

        /* Main Content */
        .main-content { flex: 1; overflow: hidden; }
        .main-header { padding: 20px 32px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
        .main-title { font-size: 20px; font-weight: 700; color: var(--accent-brand); }
        
        /* Grid */
        .grid-container { padding: 32px; }
        .time-grid { display: grid; grid-template-columns: 80px repeat(6, 1fr); gap: 8px; }
        .grid-header { font-weight: 600; font-size: 13px; color: var(--text-secondary); text-align: center; padding-bottom: 8px; }
        .grid-time { font-size: 12px; color: var(--text-tertiary); font-weight: 500; display: flex; align-items: center; justify-content: center; }
        
        .slot {
            height: 64px; border: 1px solid var(--border-light); border-radius: var(--radius-sm);
            background: #FAFAFA; transition: all 0.2s; cursor: crosshair;
            display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent;
        }
        .slot:hover { border-color: var(--accent-brand); }
        .slot.blocked {
            background: var(--blocked); border-color: var(--blocked-border); color: var(--blocked-text);
            font-weight: 600; background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(239, 68, 68, 0.05) 10px, rgba(239, 68, 68, 0.05) 20px);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const App = () => {
            const days = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
            const pairs = [1, 2, 3, 4, 5, 6];
            return (
                <div className="app-container">
                    <div className="card sidebar">
                        <div className="sidebar-header">
                            <input type="text" className="search-input" placeholder="Поиск преподавателя..." />
                        </div>
                        <div className="teacher-list">
                            <div className="teacher-item active">
                                <div className="t-name">Иванов А.С.</div>
                                <div className="t-dept">Кафедра информатики</div>
                            </div>
                            <div className="teacher-item">
                                <div className="t-name">Петров В.М.</div>
                                <div className="t-dept">Кафедра математики</div>
                            </div>
                        </div>
                    </div>

                    <div className="card main-content">
                        <div className="main-header">
                            <h2 className="main-title">Иванов А.С. – Недоступное время</h2>
                            <button style={{padding: '8px 16px', background: 'var(--accent-brand)', color: 'white', border:'none', borderRadius: '8px', cursor:'pointer', fontWeight: 600}}>Сохранить</button>
                        </div>
                        <div className="grid-container">
                            <div className="time-grid">
                                <div></div> {/* empty corner */}
                                {days.map(d => <div key={d} className="grid-header">{d}</div>)}
                                
                                {pairs.map(p => (
                                    <React.Fragment key={`pair-${p}`}>
                                        <div className="grid-time">{p} пара</div>
                                        {days.map(d => (
                                            <div key={`${d}-${p}`} 
                                                 className={`slot ${(d==='ЧТ' && (p===1||p===2)) || (d==='СБ') ? 'blocked' : ''}`}>
                                                {(d==='ЧТ' && (p===1||p===2)) || (d==='СБ') ? 'Занят' : ''}
                                            </div>
                                        ))}
                                    </React.Fragment>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
