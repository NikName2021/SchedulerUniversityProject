<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
<style>text{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:20px;font-weight:700}.box{fill:#f5f9fc;stroke:#1769aa;stroke-width:2}.core{fill:#e4f2fb;stroke:#0b5792;stroke-width:3}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#486581}.arrow{stroke:#486581;stroke-width:2.5;fill:none;marker-end:url(#a)}</style>
