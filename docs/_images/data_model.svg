<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"><style>text{font-family:Arial,sans-serif;fill:#102a43}.h{font-size:18px;font-weight:700}.t{font-size:13px}.a{fill:#e4f2fb;stroke:#1769aa;stroke-width:2}.l{stroke:#66788a;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0L0,6L8,3z" fill="#66788a"/></marker></defs><text x="30" y="32" class="h">Логическая модель данных</text><rect x="40" y="75" width="235" height="115" rx="10" class="a"/><text x="58" y="105" class="h">Справочники</text><text x="58" y="133" class="t">department · building · room</text><text x="58" y="154" class="t">room_feature · activity_type</text><text x="58" y="175" class="t">discipline · rule_profile</text><rect x="40" y="300" width="235" height="115" rx="10" class="a"/><text x="58" y="330" class="h">Учебные данные</text><text x="58" y="358" class="t">import_batch → stream</text><text x="58" y="379" class="t">stream_group → student_group</text><text x="58" y="400" class="t">teacher · availability_rule</text><rect x="430" y="75" width="290" height="115" rx="10" class="a"/><text x="448" y="105" class="h">Планирование</text><text x="448" y="133" class="t">academic_period → planning_week</text><text x="448" y="154" class="t">weekly_lesson_demand → stream</text><rect x="430" y="300" width="290" height="115" rx="10" class="a"/><text x="448" y="330" class="h">Расчёт и диагностика</text><text x="448" y="358" class="t">generation_task → components/issues/locks</text><text x="448" y="379" class="t">версии и публикация</text><rect x="865" y="190" width="260" height="115" rx="10" class="a"/><text x="883" y="220" class="h">Расписание</text><text x="883" y="248" class="t">schedule_entry</text><text x="883" y="269" class="t">группа · преподаватель · аудитория</text><text x="883" y="290" class="t">дата · пара · фиксация</text><path d="M275 132H430M275 365H430M575 190V300M720 357H795V247H865" class="l"/><text x="320" y="120" class="t">ресурсы</text><text x="325" y="353" class="t">нагрузка</text><text x="585" y="250" class="t">неделя</text><text x="745" y="345" class="t">результат</text><text x="40" y="500" class="t">Полный словарь полей, типов, свойств и внешних ключей приведён ниже на этой странице.</text></svg>
